<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Dice WiFi — fast, reliable and affordable public WiFi hotspots across Kenya. Pick a pass, pay with M-Pesa and get online in seconds. No app, no contracts." />
    <meta name="theme-color" content="#0A3D91" />
    <title>Dice WiFi — Public WiFi hotspots across Kenya</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet" />
    <script>
      (function () {
        var stored = localStorage.getItem("dice-theme");
        var dark = stored !== "light";
        document.documentElement.classList.toggle("dark", dark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
